<title id="rhizopus-mono-title">Rhizopus (mucormycosis) (single colour)</title>
<desc>Broad, ribbon-like hyphae with few septa, rooted by rhizoids, with sporangiophores bearing a sporangium full of spores, a burst one showing its columella, and a young one.</desc>
