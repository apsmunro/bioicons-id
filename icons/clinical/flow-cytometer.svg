<title id="flow-cytometer-title">Flow cytometer</title>
<desc>Inside a flow cytometer: cells pass in single file down the flow cell and cross a laser. A detector in line with the beam measures forward scatter, and detectors to the side measure fluorescence of different colours.</desc>
