<title id="cmv-infected-cell-title">CMV-infected cell</title>
<desc>An enlarged cell infected with cytomegalovirus: a large intranuclear inclusion ringed by a clear halo ("owl's eye") and small cytoplasmic inclusions, beside two normal cells.</desc>
