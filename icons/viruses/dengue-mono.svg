<title id="dengue-mono-title">Dengue virus (single colour)</title>
<desc>Mature flavivirus with its smooth surface of E-protein dimers lying flat in a herringbone of rafts, coloured by domain (I red, II yellow, III blue); also stands for Zika, yellow fever and other flaviviruses.</desc>
