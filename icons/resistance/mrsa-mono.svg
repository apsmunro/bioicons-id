<title id="mrsa-mono-title">MRSA (PBP2a) (single colour)</title>
<desc>How MRSA resists β-lactams: a normal penicillin-binding protein is blocked by the drug, so the cell wall goes uncross-linked above it, while PBP2a, which β-lactams barely bind, carries on building it.</desc>
