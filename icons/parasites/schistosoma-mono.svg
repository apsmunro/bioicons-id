<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="schistosoma-mono-title">
<title id="schistosoma-mono-title">Schistosoma (single colour)</title>
<desc>Adult schistosomes in copula: the female lying in the male's gynaecophoric canal, her ends protruding, beside an egg with a lateral spine (S. mansoni) holding a miracidium.</desc>
