<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="threadworm-title">
<title id="threadworm-title">Threadworm</title>
<desc>Enterobius vermicularis: a female worm with a long pointed tail, a smaller male with a curled tail, and eggs flattened on one side, each holding a larva.</desc>
