<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="gram-negative-cell-mono-title">
<title id="gram-negative-cell-mono-title">Gram-negative cell (cutaway) (single colour)</title>
<desc>A Gram-negative bacterium cut open: lipopolysaccharide (green) on the outer membrane, porins (blue) through it, the thin peptidoglycan wall in the pink periplasm, and the inner membrane; inside, the nucleoid, a plasmid, ribosomes and the steps of folate synthesis.</desc>
