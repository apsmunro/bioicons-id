<title id="neutrophil-diapedesis-title">Neutrophil extravasation</title>
<desc>Neutrophils leaving a blood vessel: one rolling along the endothelium on selectins, one squeezing through a junction between endothelial cells (diapedesis), and one crawling through the tissue towards bacteria.</desc>
