<title id="conjugate-vaccine-title">Conjugate vaccine</title>
<desc>Capsular polysaccharide chains linked to a carrier protein (a toxoid such as CRM197 or tetanus toxoid), so the sugars draw a T-cell-dependent response.</desc>
