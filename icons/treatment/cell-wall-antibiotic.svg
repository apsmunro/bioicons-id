<title id="cell-wall-antibiotic-title">Antibiotic acting on the cell wall</title>
<desc>A β-lactam bound to a penicillin-binding protein (PBP), so the peptide cross-links between the glycan strands of the peptidoglycan wall are not made.</desc>
