<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="perforin-title">
<title id="perforin-title">Perforin pore</title>
<desc>A cytotoxic T cell or NK cell (above) empties a granule on to its target: perforin (blue) assembles into a pore in the target cell membrane and granzymes (red) pass through to trigger apoptosis. Perforin and the granule-release machinery are defective in familial haemophagocytic lymphohistiocytosis.</desc>
