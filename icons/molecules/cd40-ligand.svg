<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="cd40-ligand-title">
<title id="cd40-ligand-title">CD40 ligand and CD40</title>
<desc>T-cell help for B cells: the trimeric CD40 ligand (orange) on an activated T cell (above) binds CD40 (green) on a B cell (below), whose tails recruit TRAF adaptors (purple). The signal drives class switching; it is lost in hyper-IgM syndrome.</desc>
