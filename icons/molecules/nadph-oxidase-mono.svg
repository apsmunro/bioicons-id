<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="nadph-oxidase-mono-title">
<title id="nadph-oxidase-mono-title">NADPH oxidase (single colour)</title>
<desc>The phagocyte NADPH oxidase on a phagosome membrane: gp91phox (blue) and p22phox (teal) cross the membrane, with p47phox, p67phox, p40phox and Rac docked beneath. An electron passes up to oxygen, making superoxide (red, with a yellow spot) to kill the bacteria above. Defective in chronic granulomatous disease.</desc>
