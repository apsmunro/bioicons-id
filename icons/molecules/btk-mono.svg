<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="btk-mono-title">
<title id="btk-mono-title">Bruton's tyrosine kinase (BTK) (single colour)</title>
<desc>B-cell receptor signalling: antigen (red) on membrane immunoglobulin signals through CD79a and CD79b, whose ITAMs (yellow) bind Syk (purple). Bruton's tyrosine kinase (orange), held at the membrane by its PH domain, then activates phospholipase C gamma 2 (teal). Absent in X-linked agammaglobulinaemia.</desc>
