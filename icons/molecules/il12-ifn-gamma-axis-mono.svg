<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="il12-ifn-gamma-axis-mono-title">
<title id="il12-ifn-gamma-axis-mono-title">IL-12 / interferon-gamma axis (single colour)</title>
<desc>A macrophage holding mycobacteria (red rods) releases IL-12 (amber circles), which acts on a T cell or NK cell; that cell answers with interferon gamma (blue diamonds), which activates the macrophage to kill. Each cell carries the receptor for the other signal. Defects cause Mendelian susceptibility to mycobacterial disease.</desc>
