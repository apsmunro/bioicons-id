<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="pre-b-cell-receptor-title">
<title id="pre-b-cell-receptor-title">Pre-B-cell receptor</title>
<desc>The pre-B-cell receptor: two mu heavy chains (blue), each paired with a surrogate light chain of VpreB (teal) and lambda 5 (amber) in place of a light chain, beside CD79a and CD79b with their ITAMs (yellow). It signals without antigen and lets a pre-B cell go on developing; defects in its parts cause agammaglobulinaemia.</desc>
