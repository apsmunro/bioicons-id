<title id="interferon-signalling-title">Interferon signalling</title>
<desc>Type I interferon binding its receptor (IFNAR1 and IFNAR2); the receptor-bound kinases (JAK1, TYK2) phosphorylate STAT1 and STAT2, which with IRF9 (ISGF3) move into the nucleus and bind DNA.</desc>
