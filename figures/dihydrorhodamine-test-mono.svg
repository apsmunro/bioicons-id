<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="dihydrorhodamine-test-mono-title">
<title id="dihydrorhodamine-test-mono-title">The dihydrorhodamine test for chronic granulomatous disease (single colour)</title>
<desc>Neutrophils are loaded with dihydrorhodamine and stimulated; the respiratory burst of the NADPH oxidase oxidises the dye to fluorescent rhodamine, which a flow cytometer measures. Normal neutrophils all shift to bright fluorescence; in chronic granulomatous disease they do not shift; an X-linked carrier has two populations.</desc>
