<title id="flow-cytometry-mono-title">Flow cytometry (single colour)</title>
<desc>How flow cytometry works: cells from a blood sample are stained with antibodies carrying fluorochromes, then passed in single file through a laser; detectors measure the scattered light and fluorescence of each cell, and the results are shown as dot plots and histograms.</desc>
