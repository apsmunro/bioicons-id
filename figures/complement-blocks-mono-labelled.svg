<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 700" width="1320" height="700" role="img" aria-labelledby="complement-blocks-mono-title">
<title id="complement-blocks-mono-title">Where complement deficiencies block the pathway (single colour)</title>
<desc>The classical, lectin and alternative pathways converge on C3; C3b coats bacteria for phagocytosis, and C5 to C9 form the membrane attack complex. Barred rings mark where inherited deficiencies stop each step, with what they cause: C1Q, C1R, C1S, C4 and C2 (lupus-like disease, encapsulated bacteria); MBL2 and MASP2 (infections in early childhood); CFB, CFD and CFP (meningococcal disease); C3, CFH and CFI (severe pyogenic infections); and C5 to C9 (recurrent meningococcal disease, as also seen with eculizumab).</desc>
