<path d="M140 446L270 277.5" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/><circle cx="270" cy="277.5" r="5" fill="#000000"/><path d="M380 446L360 310" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/><circle cx="360" cy="310" r="5" fill="#000000"/><path d="M630 446L450 298.75" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/><circle cx="450" cy="298.75" r="5" fill="#000000"/><text x="140" y="470" font-family="Arial, Helvetica, sans-serif" font-size="24" text-anchor="middle" fill="#000000">Classical pathway</text><text x="380" y="470" font-family="Arial, Helvetica, sans-serif" font-size="24" text-anchor="middle" fill="#000000">Lectin pathway</text><text x="630" y="470" font-family="Arial, Helvetica, sans-serif" font-size="24" text-anchor="middle" fill="#000000">Alternative pathway</text><text x="880" y="470" font-family="Arial, Helvetica, sans-serif" font-size="24" text-anchor="middle" fill="#000000">C3b coats</text><text x="880" y="499" font-family="Arial, Helvetica, sans-serif" font-size="24" text-anchor="middle" fill="#000000">the bacteria</text><text x="1170" y="470" font-family="Arial, Helvetica, sans-serif" font-size="24" text-anchor="middle" fill="#000000">Membrane attack</text><text x="1170" y="499" font-family="Arial, Helvetica, sans-serif" font-size="24" text-anchor="middle" fill="#000000">complex</text><text x="140" y="604" font-family="Arial, Helvetica, sans-serif" font-size="24" text-anchor="middle" fill="#000000">Lupus-like disease;</text><text x="140" y="633" font-family="Arial, Helvetica, sans-serif" font-size="24" text-anchor="middle" fill="#000000">encapsulated bacteria</text><text x="380" y="604" font-family="Arial, Helvetica, sans-serif" font-size="24" text-anchor="middle" fill="#000000">Infections in</text><text x="380" y="633" font-family="Arial, Helvetica, sans-serif" font-size="24" text-anchor="middle" fill="#000000">early childhood</text><text x="630" y="604" font-family="Arial, Helvetica, sans-serif" font-size="24" text-anchor="middle" fill="#000000">Meningococcal</text><text x="630" y="633" font-family="Arial, Helvetica, sans-serif" font-size="24" text-anchor="middle" fill="#000000">disease</text><text x="880" y="604" font-family="Arial, Helvetica, sans-serif" font-size="24" text-anchor="middle" fill="#000000">Severe pyogenic</text><text x="880" y="633" font-family="Arial, Helvetica, sans-serif" font-size="24" text-anchor="middle" fill="#000000">infections</text><text x="1170" y="604" font-family="Arial, Helvetica, sans-serif" font-size="24" text-anchor="middle" fill="#000000">Recurrent</text><text x="1170" y="633" font-family="Arial, Helvetica, sans-serif" font-size="24" text-anchor="middle" fill="#000000">meningococcal disease</text><text x="1170" y="662" font-family="Arial, Helvetica, sans-serif" font-size="24" text-anchor="middle" fill="#000000">(also eculizumab)</text><text x="140" y="536" font-family="Arial, Helvetica, sans-serif" font-size="24" text-anchor="middle" font-style="italic" fill="#000000">C1Q, C1R, C1S,</text><text x="140" y="565" font-family="Arial, Helvetica, sans-serif" font-size="24" text-anchor="middle" font-style="italic" fill="#000000">C4, C2</text><text x="380" y="536" font-family="Arial, Helvetica, sans-serif" font-size="24" text-anchor="middle" font-style="italic" fill="#000000">MBL2, MASP2</text><text x="630" y="536" font-family="Arial, Helvetica, sans-serif" font-size="24" text-anchor="middle" font-style="italic" fill="#000000">CFB, CFD, CFP</text><text x="880" y="536" font-family="Arial, Helvetica, sans-serif" font-size="24" text-anchor="middle" font-style="italic" fill="#000000">C3, CFH, CFI</text><text x="1170" y="536" font-family="Arial, Helvetica, sans-serif" font-size="24" text-anchor="middle" font-style="italic" fill="#000000">C5, C6, C7,</text><text x="1170" y="565" font-family="Arial, Helvetica, sans-serif" font-size="24" text-anchor="middle" font-style="italic" fill="#000000">C8, C9</text></svg>
